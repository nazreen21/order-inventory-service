services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-order_inventory}
      POSTGRES_USER: ${DB_USER:-order_inventory_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_dev_password}
    volumes:
      - postgres_data_v2:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-local-development-only}
      DB_NAME: ${DB_NAME:-order_inventory}
      DB_USER: ${DB_USER:-order_inventory_user}
      DB_PASSWORD: ${DB_PASSWORD:-local_dev_password}
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data_v2:
